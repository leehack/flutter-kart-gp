<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Flutter Kart Grand Prix — A 3D arcade kart racing game featuring Flutter Dash & Alpaca Llama, built 100% procedurally with Flutter GPU and flutter_scene.">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flutter Kart GP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flutter Kart Grand Prix — 3D Arcade Racing</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0E14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #132038 0%, #0A0E14 75%);
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }

    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #38BDF8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #FDE047, #F97316, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #FACC15;
      border-right-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: rgba(248, 250, 252, 0.72);
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="badge">Flutter GPU &bull; WebAssembly</div>
    <div class="title">Flutter Kart Grand Prix</div>
    <div class="spinner"></div>
    <div class="subtitle" id="loading-status">Compiling WebAssembly &amp; 3D Shaders...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 400);
      }
    });
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
